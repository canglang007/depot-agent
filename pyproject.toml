[project]
name = "depot-agent"
version = "1.0.0"
description = "Depot — 面向代码生成 Agent 的按需依赖解析系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["agent", "dependency", "code-execution", "llm", "sandbox", "pip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
depot = "depot.cli:main"

[project.urls]
Homepage = "https://github.com/canglang007/depot-agent"
Documentation = "https://github.com/canglang007/depot-agent"
Repository = "https://github.com/canglang007/depot-agent"
Issues = "https://github.com/canglang007/depot-agent/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
